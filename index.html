<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>D.D Labo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="clock">
        <h1 id="time">00:00</h1>
        <p id="date">Monday</p>
    </div>

    <button class="profile-note" type="button">
    <span>PROFILE</span>
</button>

    <div class="side-actions">

    <button class="folder-button folder-record" type="button">
        <span class="folder-border"></span>
        <span class="folder-paper"></span>
        <span class="folder-fill"></span>

        <span class="folder-content">
            <span class="folder-label">記録</span>
        </span>
    </button>

    <button class="folder-button folder-observe" type="button">
        <span class="folder-border"></span>
        <span class="folder-paper"></span>
        <span class="folder-fill"></span>

        <span class="folder-content">
            <span class="folder-label">観察</span>
        </span>
    </button>
    

</div>

<div class="level-meter">
    <div class="level-tube">
        <div class="level-liquid" id="level-liquid"></div>

        <div class="level-gloss"></div>

        <div class="level-marks">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="level-label" id="level-label">Lv.33</div>
</div>

    <div class="character">
        💜
    </div>

    <div class="menu">

        <button>勉強</button>
        <button>読書</button>
        <button>趣味</button>
        <button>TASK</button>

    </div>

    <div class="dialog" id="dialog">

    <div class="dialog-titlebar">
        <button id="next" class="next-button">▶</button>
    </div>

    <div class="name">D.D</div>

    <div id="message">
        <span id="message-text"></span>
        <span id="typing-cursor"></span>
    </div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
